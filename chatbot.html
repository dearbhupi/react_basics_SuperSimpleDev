<!doctype html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev@8.6.4/external-library.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      // Step 1: Create top level component for chatbot application
      function ChatInput() {
        return (
          <>
            <input
              type="text"
              placeholder="Send a message to chatbot..."
              size="50"
            />
            <button>Send</button>
          </>
        );
      }
      // Step 2: Create a component for chatbot profile
      function ChatProfile({ message, profile }) {
        return (
          <div>
            {profile === "robot" && (
              <img src="robot.png" width="50" height="50"></img>
            )}
            {message}
            {profile === "user" && (
              <img src="user.png" width="50" height="50"></img>
            )}
          </div>
        );
      }

      // Step 3: Create the main App component
      function App() {
        // create an array of chat messages with profile information
        const chatData = [
           {message: "Hello Chatbot", profile: "user", id:UUID() },
          { message: "Hello! How can I help you?", profile: "robot",  id:UUID() },
          { message: "Can you get me todays date?", profile: "user", id:UUID() },
          { message: "Today is June 1", profile: "robot", id:UUID() },
          { message: "Flip a coin", profile: "user", id:UUID() },
          { message: " Sure! You got heads", profile: "robot", id:UUID() },
          
        ];

        const chatMappedData = chatData.map((newChatMessage) => {
          return (
            <ChatProfile
              key={newChatMessage.id}
              message={newChatMessage.message}
              profile={newChatMessage.profile}
            />
          );

        });
       
        return (
          <>

            <ChatInput />
             {chatMappedData}
          </>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
      
    </script>
  </body>
</html>
